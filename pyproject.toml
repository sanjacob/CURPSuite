[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "CURPSuite"
description = "Análisis y validación de la CURP Mexicana"
dynamic = ["version", "readme"]
authors = [
  { name="Jacob Sánchez", email="jacobszpz@protonmail.com" },
]
requires-python = ">=3.13"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Science/Research",
    "Natural Language :: Spanish"
]
dependencies = [
    "unidecode"
]
keywords = ["CURP", "validation", "analysis", "Mexico"]

[project.scripts]
curp = "curp.cli:main"

[project.urls]
"Homepage" = "https://curpsuite.readthedocs.io"
"Repository" = "https://github.com/sanjacob/CURPSuite"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "coverage>=7.17.3",
    "sphinx>=9.2.0",
    "recommonmark>=0.7.1",
    "mypy>=2.4.1",
    "twine>=7.0.0",
    "flake8>=7.5.0",
    "setuptools>=84.2.1",
    "build>=1.6.1",
]

[tool.setuptools.dynamic]
version = {attr = "curp.__about__.__version__"}
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.coverage.run]
branch = true

[tool.coverage.report]
omit = [
    "*/python?.?/*",
    "*/lib-python/?.?/*.py",
    "*/pypy/*"
]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]
